<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Offroad Truck</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #game { width: 100%; height: 100%; display: block; }
        #controls {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 max(20px, env(safe-area-inset-left));
            z-index: 10;
        }
        .btn {
            width: 80px;
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            opacity: 0.85;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:active { opacity: 1; transform: scale(0.95); }
        #btnGo { background: #2ecc40; }
        #btnBrake { background: #ff4136; }
        #btnReverse { background: #ff851b; }
        @media (orientation: landscape) {
            #controls {
                bottom: 10px;
                right: max(10px, env(safe-area-inset-right));
                left: auto;
                flex-direction: column;
                padding: 0;
            }
            .btn { width: 70px; height: 50px; font-size: 12px; }
        }
        #hud {
            position: fixed;
            top: max(50px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            color: #fff;
            font-size: 16px;
            z-index: 10;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        #tilt-prompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            text-align: center;
            z-index: 20;
            background: rgba(0,0,0,0.7);
            padding: 20px 30px;
            border-radius: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud">
        <div id="speed-display">Speed: 0 km/h</div>
    </div>
    <div id="controls">
        <button class="btn" id="btnReverse">REV</button>
        <button class="btn" id="btnBrake">BRAKE</button>
        <button class="btn" id="btnGo">GO</button>
    </div>
    <div id="tilt-prompt">Tap to enable motion controls<br><small>Tilt phone left/right to steer</small></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 80, 200);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(30, 50, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 150;
    dirLight.shadow.camera.left = -60;
    dirLight.shadow.camera.right = 60;
    dirLight.shadow.camera.top = 60;
    dirLight.shadow.camera.bottom = -60;
    scene.add(dirLight);

    // Terrain
    const CHUNK_SIZE = 40;
    const CHUNK_SEGMENTS = 40;
    const CHUNKS_AHEAD = 5;
    const CHUNKS_BEHIND = 2;
    const chunks = new Map();

    function getTerrainHeight(x, z) {
        const s1 = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 3;
        const s2 = Math.sin(x * 0.12 + 1.5) * Math.cos(z * 0.08 + 0.7) * 1.5;
        const s3 = Math.sin(x * 0.25 + 3.0) * Math.cos(z * 0.3 + 2.0) * 0.5;
        return s1 + s2 + s3;
    }

    function createChunk(chunkX, chunkZ) {
        const key = `${chunkX},${chunkZ}`;
        if (chunks.has(key)) return;

        const geo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_SEGMENTS, CHUNK_SEGMENTS);
        geo.rotateX(-Math.PI / 2);
        const positions = geo.attributes.position;

        for (let i = 0; i < positions.count; i++) {
            const x = positions.getX(i) + chunkX * CHUNK_SIZE;
            const z = positions.getZ(i) + chunkZ * CHUNK_SIZE;
            positions.setY(i, getTerrainHeight(x, z));
        }
        geo.computeVertexNormals();

        const mat = new THREE.MeshLambertMaterial({ color: 0x8B6914 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(chunkX * CHUNK_SIZE, 0, chunkZ * CHUNK_SIZE);
        mesh.receiveShadow = true;
        scene.add(mesh);

        // Scatter random spheres on this chunk
        const sphereGroup = new THREE.Group();
        const SPHERES_PER_CHUNK = 8;
        const sphereGeo = new THREE.SphereGeometry(0.75, 12, 8);
        const seed = Math.abs(chunkX * 7919 + chunkZ * 6271);
        for (let i = 0; i < SPHERES_PER_CHUNK; i++) {
            const hash = Math.sin(seed + i * 9973) * 43758.5453;
            const r = hash - Math.floor(hash);
            const hash2 = Math.sin(seed + i * 7727 + 1.3) * 43758.5453;
            const r2 = hash2 - Math.floor(hash2);
            const sx = (r - 0.5) * CHUNK_SIZE + chunkX * CHUNK_SIZE;
            const sz = (r2 - 0.5) * CHUNK_SIZE + chunkZ * CHUNK_SIZE;
            const sy = getTerrainHeight(sx, sz) + 0.75;
            const color = new THREE.Color().setHSL((r * 7 + r2 * 3) % 1, 0.8, 0.5);
            const smat = new THREE.MeshLambertMaterial({ color });
            const sphere = new THREE.Mesh(sphereGeo, smat);
            sphere.position.set(sx - chunkX * CHUNK_SIZE, sy, sz - chunkZ * CHUNK_SIZE);
            sphere.castShadow = true;
            sphereGroup.add(sphere);
        }
        sphereGroup.position.set(chunkX * CHUNK_SIZE, 0, chunkZ * CHUNK_SIZE);
        scene.add(sphereGroup);

        chunks.set(key, { terrain: mesh, spheres: sphereGroup });
    }

    function updateChunks(truckX, truckZ) {
        const currentChunkX = Math.round(truckX / CHUNK_SIZE);
        const currentChunkZ = Math.round(truckZ / CHUNK_SIZE);
        const RANGE = 5;

        for (let dz = -CHUNKS_BEHIND; dz <= CHUNKS_AHEAD; dz++) {
            for (let dx = -RANGE; dx <= RANGE; dx++) {
                createChunk(currentChunkX + dx, currentChunkZ + dz);
            }
        }

        for (const [key, chunk] of chunks) {
            const [cx, cz] = key.split(',').map(Number);
            if (Math.abs(cz - currentChunkZ) > CHUNKS_BEHIND + 2 ||
                Math.abs(cx - currentChunkX) > RANGE + 2) {
                scene.remove(chunk.terrain);
                chunk.terrain.geometry.dispose();
                chunk.terrain.material.dispose();
                chunk.spheres.traverse(c => {
                    if (c.isMesh) { c.geometry.dispose(); c.material.dispose(); }
                });
                scene.remove(chunk.spheres);
                chunks.delete(key);
            }
        }
    }

    // Truck
    const truck = new THREE.Group();

    // Body
    const bodyGeo = new THREE.BoxGeometry(2, 1, 3.5);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0xcc3333 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    truck.add(body);

    // Cab
    const cabGeo = new THREE.BoxGeometry(1.8, 0.9, 1.5);
    const cabMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const cab = new THREE.Mesh(cabGeo, cabMat);
    cab.position.set(0, 2.0, -0.5);
    cab.castShadow = true;
    truck.add(cab);

    // Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 12);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const wheelPositions = [
        [-1.1, 0.5, 1.0],
        [1.1, 0.5, 1.0],
        [-1.1, 0.5, -1.0],
        [1.1, 0.5, -1.0]
    ];
    const wheels = [];
    wheelPositions.forEach(([x, y, z]) => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, y, z);
        wheel.castShadow = true;
        truck.add(wheel);
        wheels.push(wheel);
    });

    truck.position.set(0, 0, 0);
    scene.add(truck);

    // Physics state
    let speed = 0;
    let steerAngle = 0;
    let truckRotation = 0;
    const MAX_SPEED = 30;
    const ACCELERATION = 12;
    const BRAKE_FORCE = 20;
    const FRICTION = 3;
    const STEER_SPEED = 2.5;

    // Engine sound (single-cylinder lawnmower)
    let audioCtx = null;
    let engineOsc = null;
    let engineGain = null;
    let puttOsc = null;
    let puttGain = null;
    let engineNoise = null;
    let noiseGain = null;
    let masterGain = null;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.25;
        masterGain.connect(audioCtx.destination);

        // Main engine tone — low sawtooth for that rough combustion sound
        engineOsc = audioCtx.createOscillator();
        engineOsc.type = 'sawtooth';
        engineOsc.frequency.value = 55;

        // Pulse oscillator to chop the tone into putt-putt firing pattern
        puttOsc = audioCtx.createOscillator();
        puttOsc.type = 'square';
        puttOsc.frequency.value = 25;
        puttGain = audioCtx.createGain();
        puttGain.gain.value = 0.5;
        puttOsc.connect(puttGain);

        engineGain = audioCtx.createGain();
        engineGain.gain.value = 0;

        // Distortion for grit
        const distortion = audioCtx.createWaveShaper();
        const curve = new Float32Array(256);
        for (let i = 0; i < 256; i++) {
            const x = (i * 2) / 256 - 1;
            curve[i] = Math.sign(x) * Math.pow(Math.abs(x), 0.4);
        }
        distortion.curve = curve;

        // Second harmonic for body
        const engineOsc2 = audioCtx.createOscillator();
        engineOsc2.type = 'square';
        engineOsc2.frequency.value = 110;
        const osc2Gain = audioCtx.createGain();
        osc2Gain.gain.value = 0.3;
        engineOsc2.connect(osc2Gain);
        osc2Gain.connect(engineGain);
        engineOsc2.start();
        // Store so we can update its frequency
        engineOsc._osc2 = engineOsc2;

        engineOsc.connect(engineGain);
        // Modulate engine gain with the putt oscillator
        puttGain.connect(engineGain.gain);
        engineGain.connect(distortion);
        distortion.connect(masterGain);

        engineOsc.start();
        puttOsc.start();

        // Exhaust noise
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        engineNoise = audioCtx.createBufferSource();
        engineNoise.buffer = noiseBuffer;
        engineNoise.loop = true;
        noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0;
        // Low-pass the noise for a muffled exhaust
        const noiseLPF = audioCtx.createBiquadFilter();
        noiseLPF.type = 'lowpass';
        noiseLPF.frequency.value = 400;
        engineNoise.connect(noiseLPF);
        noiseLPF.connect(noiseGain);
        noiseGain.connect(masterGain);
        engineNoise.start();
    }

    function updateEngineSound(spd, gas) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const absSpeed = Math.abs(spd);
        const t = absSpeed / MAX_SPEED;
        // Firing frequency: ~25Hz idle to ~55Hz full throttle
        const firingFreq = 25 + t * 30;
        puttOsc.frequency.setTargetAtTime(firingFreq, audioCtx.currentTime, 0.08);
        // Engine tone follows firing freq with harmonics
        const baseFreq = 55 + t * 80;
        engineOsc.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.08);
        engineOsc._osc2.frequency.setTargetAtTime(baseFreq * 2, audioCtx.currentTime, 0.08);
        // Volume
        const vol = gas ? 0.4 + t * 0.3 : (absSpeed > 0.5 ? 0.15 : 0);
        engineGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.1);
        const nv = gas ? 0.06 + t * 0.04 : (absSpeed > 0.5 ? 0.02 : 0);
        noiseGain.gain.setTargetAtTime(nv, audioCtx.currentTime, 0.1);
    }

    // Controls state
    let gasPressed = false;
    let brakePressed = false;
    let reversePressed = false;
    let tiltX = 0;
    let motionEnabled = false;

    // Button events
    function addButtonEvents(btn, onDown, onUp) {
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });
        btn.addEventListener('mousedown', onDown);
        btn.addEventListener('mouseup', onUp);
        btn.addEventListener('mouseleave', onUp);
    }

    addButtonEvents(document.getElementById('btnGo'),
        () => { initAudio(); gasPressed = true; }, () => gasPressed = false);
    addButtonEvents(document.getElementById('btnBrake'),
        () => { initAudio(); brakePressed = true; }, () => brakePressed = false);
    addButtonEvents(document.getElementById('btnReverse'),
        () => { initAudio(); reversePressed = true; }, () => reversePressed = false);

    // Accelerometer
    const tiltPrompt = document.getElementById('tilt-prompt');

    if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            tiltPrompt.style.display = 'block';
            tiltPrompt.addEventListener('click', async () => {
                try {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm === 'granted') {
                        motionEnabled = true;
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                } catch (e) {}
                tiltPrompt.style.display = 'none';
            });
        } else {
            motionEnabled = true;
            window.addEventListener('deviceorientation', handleOrientation);
        }
    }

    function handleOrientation(e) {
        if (e.gamma === null) return;
        const angle = screen.orientation ? screen.orientation.angle : (window.orientation || 0);
        let steer = 0;
        if (angle === 0) steer = e.gamma;
        else if (angle === 90) steer = -e.beta;
        else if (angle === -90 || angle === 270) steer = e.beta;
        else if (angle === 180) steer = -e.gamma;
        tiltX = THREE.MathUtils.clamp(steer / 30, -1, 1);
    }

    // Fallback: touch steering on left side of screen
    let touchSteer = 0;
    canvas.addEventListener('touchstart', handleTouchSteer);
    canvas.addEventListener('touchmove', handleTouchSteer);
    canvas.addEventListener('touchend', () => touchSteer = 0);

    function handleTouchSteer(e) {
        if (!motionEnabled) {
            const touch = e.touches[0];
            if (touch && touch.clientY < window.innerHeight * 0.6) {
                const centerX = window.innerWidth / 2;
                touchSteer = THREE.MathUtils.clamp((touch.clientX - centerX) / (window.innerWidth * 0.3), -1, 1);
            }
        }
    }

    // Game loop
    const clock = new THREE.Clock();
    const speedDisplay = document.getElementById('speed-display');

    function getGroundHeight(x, z) {
        return getTerrainHeight(x, z);
    }

    function getGroundNormal(x, z) {
        const delta = 0.5;
        const hL = getTerrainHeight(x - delta, z);
        const hR = getTerrainHeight(x + delta, z);
        const hF = getTerrainHeight(x, z - delta);
        const hB = getTerrainHeight(x, z + delta);
        const normal = new THREE.Vector3(hL - hR, 2 * delta, hF - hB).normalize();
        return normal;
    }

    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        // Steering input
        const steerInput = motionEnabled ? tiltX : -touchSteer;
        steerAngle = steerInput * STEER_SPEED;

        // Acceleration
        if (gasPressed) {
            speed += ACCELERATION * dt;
        } else if (reversePressed) {
            speed -= ACCELERATION * 0.6 * dt;
        }

        if (brakePressed) {
            if (speed > 0) speed -= BRAKE_FORCE * dt;
            else if (speed < 0) speed += BRAKE_FORCE * dt;
            if (Math.abs(speed) < 0.5) speed = 0;
        }

        // Friction
        if (!gasPressed && !reversePressed && !brakePressed) {
            if (speed > 0) speed = Math.max(0, speed - FRICTION * dt);
            else if (speed < 0) speed = Math.min(0, speed + FRICTION * dt);
        }

        speed = THREE.MathUtils.clamp(speed, -MAX_SPEED * 0.4, MAX_SPEED);

        // Turning
        if (Math.abs(speed) > 0.1) {
            truckRotation += steerAngle * dt * (speed / MAX_SPEED) * 2;
        }

        // Move truck
        const moveX = Math.sin(truckRotation) * speed * dt;
        const moveZ = Math.cos(truckRotation) * speed * dt;
        truck.position.x += moveX;
        truck.position.z += moveZ;

        // Ground following
        const groundY = getGroundHeight(truck.position.x, truck.position.z);
        truck.position.y = groundY + 0.3;

        // Tilt truck to match terrain
        const normal = getGroundNormal(truck.position.x, truck.position.z);
        const up = new THREE.Vector3(0, 1, 0);
        const quat = new THREE.Quaternion().setFromUnitVectors(up, normal);
        const yawQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), truckRotation);
        truck.quaternion.copy(yawQuat).premultiply(quat);

        // Spin wheels
        wheels.forEach(w => {
            w.rotation.x += speed * dt * 2;
        });

        // Sphere collision
        const truckPos = truck.position;
        for (const [key, chunk] of chunks) {
            const spheres = chunk.spheres;
            for (let i = spheres.children.length - 1; i >= 0; i--) {
                const s = spheres.children[i];
                const wx = s.position.x + spheres.position.x;
                const wz = s.position.z + spheres.position.z;
                const dx = truckPos.x - wx;
                const dz = truckPos.z - wz;
                if (dx * dx + dz * dz < 4) {
                    bodyMat.color.copy(s.material.color);
                    s.material.dispose();
                    spheres.remove(s);
                }
            }
        }

        // Update chunks
        updateChunks(truck.position.x, truck.position.z);

        // Camera
        const camOffset = new THREE.Vector3(0, 7, -10);
        camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), truckRotation);
        const camTarget = truck.position.clone().add(camOffset);
        camTarget.y = Math.max(camTarget.y, getGroundHeight(camTarget.x, camTarget.z) + 2);
        camera.position.lerp(camTarget, 4 * dt);
        camera.lookAt(truck.position.x, truck.position.y + 1.5, truck.position.z);

        // Move directional light with truck
        dirLight.position.set(truck.position.x + 30, 50, truck.position.z + 30);
        dirLight.target.position.copy(truck.position);
        dirLight.target.updateMatrixWorld();

        // Engine sound
        updateEngineSound(speed, gasPressed || reversePressed);

        // HUD
        const displaySpeed = Math.abs(Math.round(speed * 3.6));
        speedDisplay.textContent = `Speed: ${displaySpeed} km/h`;

        renderer.render(scene, camera);
    }

    function handleResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', () => setTimeout(handleResize, 150));

    // Initial chunks
    updateChunks(0, 0);
    animate();
    </script>
</body>
</html>
